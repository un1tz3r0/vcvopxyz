<text x="70.0" y="174" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Plays every</text>
<text x="70.0" y="191" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">track.</text>
<rect x="140" y="96" width="108" height="112" rx="8" fill="#2FC6E0" fill-opacity="0.13" stroke="#2FC6E0" stroke-width="2"/>
<text x="194.0" y="120" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Synth</text>
<text x="194.0" y="137" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Breakout</text>
<text x="194.0" y="174" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Takes track</text>
<text x="194.0" y="191" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">5 (bass).</text>
<rect x="264" y="96" width="108" height="112" rx="8" fill="#2FC6E0" fill-opacity="0.13" stroke="#2FC6E0" stroke-width="2"/>
<text x="318.0" y="120" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Synth</text>
<text x="318.0" y="137" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Breakout</text>
<text x="318.0" y="174" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Takes track</text>
<text x="318.0" y="191" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">6 (lead).</text>
<rect x="388" y="96" width="108" height="112" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="442.0" y="120" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Screen</text>
<text x="442.0" y="157" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Shows the</text>
<text x="442.0" y="174" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">selected</text>
<text x="442.0" y="191" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">track.</text>
<rect x="512" y="96" width="108" height="112" rx="8" fill="#FF8A3D" fill-opacity="0.13" stroke="#FF8A3D" stroke-width="2"/>
<text x="566.0" y="120" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Drum</text>
<text x="566.0" y="137" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">Breakout</text>
<text x="566.0" y="174" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">Takes track</text>
<text x="566.0" y="191" font-size="13" font-weight="400" fill="#1f2328" text-anchor="middle">1 (kick).</text>
<rect x="636" y="96" width="108" height="112" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="690.0" y="120" font-size="14" font-weight="700" fill="#59636e" text-anchor="middle">Another</text>
<text x="690.0" y="137" font-size="14" font-weight="700" fill="#59636e" text-anchor="middle">plugin&#x27;s</text>
<text x="690.0" y="154" font-size="14" font-weight="700" fill="#59636e" text-anchor="middle">module</text>
<text x="690.0" y="174" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">Ends the row.</text>
