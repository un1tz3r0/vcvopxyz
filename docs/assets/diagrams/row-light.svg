<svg xmlns="http://www.w3.org/2000/svg" width="880" height="252" viewBox="0 0 880 252" font-family="Nunito, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<text x="24" y="32" font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">Each breakout takes the first free track of its kind, left to right</text>
<text x="80.0" y="66" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">The row: modules that touch, with no cables between them</text>
