<text x="814.0" y="120" font-size="14" font-weight="700" fill="#59636e" text-anchor="middle">Synth</text>
<text x="814.0" y="137" font-size="14" font-weight="700" fill="#59636e" text-anchor="middle">Breakout</text>
<text x="814.0" y="157" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">Takes no</text>
<text x="814.0" y="174" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">track. Shows</text>
<text x="814.0" y="191" font-size="13" font-weight="400" fill="#59636e" text-anchor="middle">a dash.</text>
<text x="24" y="236" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">A breakout with no Sequencer to its left, or past a module from another plugin, plays nothing.</text>
