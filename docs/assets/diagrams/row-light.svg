<path d="M194.0 74V96" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M318.0 74V96" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M442.0 74V96" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<path d="M566.0 74V96" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
