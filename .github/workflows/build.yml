# Builds the plugin for every platform Rack supports on each push and pull request, keeping the
# .vcvplugin packages as workflow artifacts. Pushing a tag vX.Y.Z that matches the version in
# plugin.json also publishes them as a GitHub release. So does running the workflow by hand on main with
# "release" ticked, or pushing a commit to main that changes the version in plugin.json (the tag is created
# for that commit), or merging a pull request labelled "release" (release.yml): those tag the commit with
# plugin.json's version themselves.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release of main, tagged with plugin.json's version
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      ref:
        description: The commit to build and release, if not the one that triggered the run
        type: string
        default: ''

env:
  RACK_SDK_VERSION: 2.6.6

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.v.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          bumped=false
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            new=$(jq -r .version plugin.json)
            old=$(git show "$BEFORE:plugin.json" 2>/dev/null | jq -r .version || true)
            if [ -n "$old" ] && [ "$old" != "$new" ] \
               && ! git ls-remote --exit-code --tags origin "v$new" >/dev/null; then
              bumped=true
            fi
          fi
          echo "bumped=$bumped" >> "$GITHUB_OUTPUT"

  linux:
    runs-on: ubuntu-latest
    # An older distribution's glibc, so the plugin also loads on older Linux systems.
    container: ubuntu:20.04
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential ca-certificates curl unzip jq zstd
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Get Rack SDK
        run: curl -fsSL "https://vcvrack.com/downloads/Rack-SDK-$RACK_SDK_VERSION-lin-x64.zip" -o sdk.zip && unzip -q sdk.zip -d ..
      - name: Build
        run: make dist RACK_DIR=../Rack-SDK
      - uses: actions/upload-artifact@v4
        with:
          name: lin-x64
          path: dist/*.vcvplugin

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make tar unzip zstd curl jq mingw-w64-x86_64-gcc
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Get Rack SDK
        run: curl -fsSL "https://vcvrack.com/downloads/Rack-SDK-$RACK_SDK_VERSION-win-x64.zip" -o sdk.zip && unzip -q sdk.zip -d ..
      - name: Build
        run: make dist RACK_DIR=../Rack-SDK
      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: dist/*.vcvplugin

  mac:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-apple-darwin }
          - { arch: arm64, target: arm64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Get Rack SDK
        run: curl -fsSL "https://vcvrack.com/downloads/Rack-SDK-$RACK_SDK_VERSION-mac-${{ matrix.arch }}.zip" -o sdk.zip && unzip -q sdk.zip -d ..
      - name: Build
        run: make dist RACK_DIR=../Rack-SDK CROSS_COMPILE=${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/*.vcvplugin

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (inputs.release && (github.ref == 'refs/heads/main' || inputs.ref != '')) ||
      needs.version.outputs.bumped == 'true'
    needs: [version, linux, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Check the tag matches plugin.json
        run: |
          version=$(jq -r .version plugin.json)
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            if git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
              echo "::error::v$version is already tagged; bump the version in plugin.json first"
              exit 1
            fi
            echo "TAG=v$version" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in plugin.json"
            exit 1
          else
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.ref || github.sha }}
        run: gh release create "$TAG" dist/*.vcvplugin --target "$TARGET" --title "$TAG" --generate-notes
